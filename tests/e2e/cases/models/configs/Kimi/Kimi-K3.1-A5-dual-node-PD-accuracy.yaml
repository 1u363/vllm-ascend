# Simulation for review. Each A5 node must fit a complete model replica at TP8.
# Replace this shared path with compatible weights (use a reduced checkpoint if needed).
# Assumes the K3.1 checkpoint supports the K3 tokenizer/parser and Mooncake V2.
test_name: Kimi-K3.1-A5-dual-node-PD-accuracy
model: &model_path /models/Kimi-K3.1
num_nodes: 2
npu_per_node: 8
dp_load_balancing: internal
# Outside Kubernetes, set cluster_hosts to [prefill_node_ip, decode_node_ip].
disaggregated_prefill:
  enabled: true
  prefiller_host_index: [0]
  decoder_host_index: [1]

env_common: &env_common
  MODEL_PATH: *model_path
  SERVER_PORT: "8080"
  VLLM_USE_V2_MODEL_RUNNER: "1"
  HCCL_OP_EXPANSION_MODE: "CCU_SCHED"
  HCCL_BUFFSIZE: "800"
  PYTORCH_NPU_ALLOC_CONF: "expandable_segments:True"

deployment:
  # Node 0 processes prompts and produces KV cache.
  - envs: *env_common
    server_cmd: >-
      vllm serve "$MODEL_PATH"
      --host 0.0.0.0 --port $SERVER_PORT
      --tensor-parallel-size 8 --data-parallel-size 1
      --distributed-executor-backend mp --enable-expert-parallel
      --tokenizer-mode kimi_k3 --reasoning-parser kimi_k3
      --trust-remote-code --enforce-eager --seed 1024
      --max-model-len 49152 --max-num-seqs 8 --max-num-batched-tokens 8192
      --block-size 768 --enable-prefix-caching
      --kv-transfer-config '{"kv_connector":"MooncakeConnectorV2","kv_role":"kv_producer","kv_port":30000,
      "kv_connector_extra_config":{"prefill":{"dp_size":1,"tp_size":8,"pp_size":1},"decode":{"dp_size":1,"tp_size":8}}}'
  # Node 1 consumes the transferred cache and generates the answer.
  - envs: *env_common
    server_cmd: >-
      vllm serve "$MODEL_PATH"
      --host 0.0.0.0 --port $SERVER_PORT
      --tensor-parallel-size 8 --data-parallel-size 1
      --distributed-executor-backend mp --enable-expert-parallel
      --tokenizer-mode kimi_k3 --reasoning-parser kimi_k3
      --trust-remote-code --enforce-eager --seed 1024
      --max-model-len 49152 --max-num-seqs 8 --max-num-batched-tokens 768
      --block-size 768 --enable-prefix-caching
      --kv-transfer-config '{"kv_connector":"MooncakeConnectorV2","kv_role":"kv_consumer","kv_port":30100,
      "kv_connector_extra_config":{"prefill":{"dp_size":1,"tp_size":8,"pp_size":1},"decode":{"dp_size":1,"tp_size":8}}}'

benchmarks:
  acc_aime2025:
    case_type: accuracy
    dataset_path: vllm-ascend/aime2025
    request_conf: vllm_api_general_chat
    dataset_conf: aime2025/aime2025_gen_0_shot_chat_prompt
    max_out_len: 32768
    batch_size: 8
    temperature: 1.0
    top_p: 1
    # Borrowed from K2.6/K2.7 128k PD for illustration. Calibrate with K3.1 results.
    baseline: 93.33
    threshold: 10
