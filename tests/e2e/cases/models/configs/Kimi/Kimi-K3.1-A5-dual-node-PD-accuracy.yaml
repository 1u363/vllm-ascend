test_name: Kimi-K3.1-A5-dual-node-PD-accuracy
model: /root/.cahce/modelscope/hub/models/Kimi-K3.1-EP256-uniform-20261116
num_nodes: 2
npu_per_node: 8
dp_load_balancing: external

routing:
  type: "disaggregated_prefill"
  groups:
    prefiller: [ 0 ]
    decoder: [ 1 ]

config:
  - node_index: 0
    port_start: 7100
    dp_rpc_port: 12321
    dp_size: 1
    dp_size_local: 1
    dp_rank_start: 0
    tp_size: 8
    dp_address: "${NODE_0_IP}"

  - node_index: 1
    port_start: 7100
    dp_rpc_port: 12321
    dp_size: 1
    dp_size_local: 1
    dp_rank_start: 0
    tp_size: 8
    dp_address: "${NODE_1_IP}"

# For bare-metal runs, set cluster_hosts in [prefill, decode] order.
env_common: &env_common
  VLLM_USE_V2_MODEL_RUNNER: "1"
  HCCL_OP_EXPANSION_MODE: "CCU_SCHED"
  HCCL_BUFFSIZE: "800"
  PYTORCH_NPU_ALLOC_CONF: "expandable_segments:True"
  ASCEND_RT_VISIBLE_DEVICES: "${VISIBLE_DEVICES}"

templates:
  - node_index: 0
    envs: *env_common
    server_cmd_template:
      - --host
      - "0.0.0.0"
      - --port
      - "${PORT}"
      - --tensor-parallel-size
      - "${TP_SIZE}"
      - --data-parallel-size
      - "${DP_SIZE}"
      - --data-parallel-rank
      - "${DP_RANK}"
      - --data-parallel-address
      - "${DP_ADDRESS}"
      - --data-parallel-rpc-port
      - "${DP_RPC_PORT}"
      - --distributed-executor-backend
      - "mp"
      - --enable-expert-parallel
      - --tokenizer-mode
      - "kimi_k3"
      - --reasoning-parser
      - "kimi_k3"
      - --trust-remote-code
      - --enforce-eager
      - --seed
      - "1024"
      - --max-model-len
      - "16384"
      - --max-num-seqs
      - "8"
      - --max-num-batched-tokens
      - "8192"
      - --block-size
      - "768"
      - --cp-kv-cache-interleave-size
      - "768"
      - --enable-prefix-caching
      - --kv-transfer-config
      - '{"kv_connector":"MooncakeConnectorV2","kv_role":"kv_producer","kv_port":30000,"kv_connector_extra_config":{"prefill":{"dp_size":1,"tp_size":8,"pp_size":1},"decode":{"dp_size":1,"tp_size":8}}}'

  - node_index: 1
    envs: *env_common
    server_cmd_template:
      - --host
      - "0.0.0.0"
      - --port
      - "${PORT}"
      - --tensor-parallel-size
      - "${TP_SIZE}"
      - --data-parallel-size
      - "${DP_SIZE}"
      - --data-parallel-rank
      - "${DP_RANK}"
      - --data-parallel-address
      - "${DP_ADDRESS}"
      - --data-parallel-rpc-port
      - "${DP_RPC_PORT}"
      - --distributed-executor-backend
      - "mp"
      - --enable-expert-parallel
      - --tokenizer-mode
      - "kimi_k3"
      - --reasoning-parser
      - "kimi_k3"
      - --trust-remote-code
      - --enforce-eager
      - --seed
      - "1024"
      - --max-model-len
      - "16384"
      - --max-num-seqs
      - "8"
      - --max-num-batched-tokens
      - "768"
      - --block-size
      - "768"
      - --cp-kv-cache-interleave-size
      - "768"
      - --enable-prefix-caching
      - --kv-transfer-config
      - '{"kv_connector":"MooncakeConnectorV2","kv_role":"kv_consumer","kv_port":30100,"kv_connector_extra_config":{"prefill":{"dp_size":1,"tp_size":8,"pp_size":1},"decode":{"dp_size":1,"tp_size":8}}}'

benchmarks:
  acc_gpqa:
    case_type: accuracy
    dataset_path_local: /root/.cache/modelscope/hub/datasets/gpqa
    request_conf: vllm_api_general_chat
    dataset_conf: gpqa/gpqa_gen_0_shot_cot_chat_prompt
    batch_size: 8
    max_out_len: 8192
    temperature: 0
    top_p: 1
    # AISBench accepts scores in [baseline - threshold, baseline + threshold].
    baseline: 50.0
    threshold: 50.0
