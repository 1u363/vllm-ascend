# A5 accuracy simulation. Each TP8 node must fit one complete model replica.
test_name: Kimi-K3.1-A5-dual-node-PD-accuracy
model: &checkpoint /root/.cahce/modelscope/hub/models/Kimi-K3.1-EP256-uniform-20261116
num_nodes: 2
npu_per_node: 8
dp_load_balancing: internal
# For bare-metal runs, set cluster_hosts in a local copy, in [prefill, decode] order.
disaggregated_prefill:
  enabled: true
  prefiller_host_index: [0]
  decoder_host_index: [1]

env_common: &env_common
  MODEL_PATH: *checkpoint
  SERVER_PORT: "8080"
  VLLM_USE_V2_MODEL_RUNNER: "1"
  HCCL_OP_EXPANSION_MODE: "CCU_SCHED"
  HCCL_BUFFSIZE: "800"
  PYTORCH_NPU_ALLOC_CONF: "expandable_segments:True"

deployment:
  - envs:
      <<: *env_common
      KV_ROLE: kv_producer
      KV_PORT: "30000"
      BATCHED_TOKENS: "8192"
    server_cmd: &serve >-
      vllm serve "$MODEL_PATH"
      --host 0.0.0.0 --port $SERVER_PORT
      --tokenizer-mode kimi_k3 --reasoning-parser kimi_k3 --trust-remote-code
      --tensor-parallel-size 8 --data-parallel-size 1 --enable-expert-parallel
      --distributed-executor-backend mp --enforce-eager --seed 1024
      --max-model-len 16384 --max-num-seqs 8 --max-num-batched-tokens $BATCHED_TOKENS
      --block-size 768 --cp-kv-cache-interleave-size 768 --enable-prefix-caching
      --kv-transfer-config
      '{"kv_connector":"MooncakeConnectorV2","kv_role":"$KV_ROLE","kv_port":$KV_PORT,
      "kv_connector_extra_config":{"prefill":{"dp_size":1,"tp_size":8,"pp_size":1},"decode":{"dp_size":1,"tp_size":8}}}'
  - envs:
      <<: *env_common
      KV_ROLE: kv_consumer
      KV_PORT: "30100"
      BATCHED_TOKENS: "768"
    server_cmd: *serve

benchmarks:
  acc_aime2025:
    case_type: accuracy
    dataset_path: vllm-ascend/aime2025
    request_conf: vllm_api_general_chat
    dataset_conf: aime2025/aime2025_gen_0_shot_chat_prompt
    batch_size: 8
    max_out_len: 8192
    temperature: 0
    top_p: 1
    # AISBench accepts scores in [baseline - threshold, baseline + threshold].
    baseline: 50.0
    threshold: 50.0
